<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Itzfizz - Classic Animated Experience</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- Custom Glow Cursor -->
  <div class="cursor-glow" id="cursor"></div>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">ITZFIZZ</div>
    <div class="nav-tag"><span class="pulse-dot"></span> LUXURY MOTION</div>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <div class="badge-wrapper">
        <span class="classic-badge">✦ BESPOKE MOTION DESIGN</span>
      </div>
      
      <h1 class="headline">
        <span class="word">W E L C O M E</span>
        <span class="word gold-gradient">I T Z F I Z Z</span>
      </h1>

      <div class="gold-divider"></div>
      
      <p class="subline">
        Crafting high-speed digital architectures & immersive motion experiences.
      </p>

      <!-- Interactive Metrics Grid -->
      <div class="metrics-grid">
        <div class="metric-card">
          <h2><span class="counter" data-target="99">0</span>%</h2>
          <p>Satisfaction</p>
        </div>
        <div class="metric-card">
          <h2><span class="counter" data-target="85">0</span>+</h2>
          <p>Projects</p>
        </div>
        <div class="metric-card">
          <h2><span class="counter" data-target="10">0</span>x</h2>
          <p>Speed Boost</p>
        </div>
      </div>
    </div>

    <!-- Animated Visual Container with Road Background -->
    <div class="visual-wrapper">
      <div class="visual-frame" id="visual-frame">
        <!-- Road Background Element -->
        <div class="road-bg"></div>
        <img src="https://images.unsplash.com/photo-1617814076367-b759c7d7e738?q=80&w=1000&auto=format&fit=crop" alt="Sports Car on Road" id="animated-car" />
        <div class="speed-lines"></div>
      </div>
    </div>
  </section>

  <!-- Next Section -->
  <section class="next-section">
    <h2 class="reveal-text">Precision & Performance</h2>
    <p>Scroll up and down to experience GSAP dynamic motion.</p>
  </section>

  <!-- GSAP Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
